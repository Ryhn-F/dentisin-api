[project]
name = "dentisai-recommender"
version = "0.1.0"
description = "DentisAI toothpaste (fluoride-only v1) recommendation rules and reference implementation"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.21"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-jsonschema",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The project directory *is* the `recommender` package (repo layout is fixed by the
# backend contract: recommender/rules.json, recommender/products.json, ...).
[tool.setuptools]
packages = ["recommender"]
package-dir = { recommender = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=recommender.recommend --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
mypy_path = ".."
packages = ["recommender"]
exclude = ['\.venv']
