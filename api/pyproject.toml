[project]
name = "dentisai-api"
version = "0.1.0"
description = "DentisAI FastAPI service for ML & AI integration only (ADR 005/009): review queue, model registry, optional QA inference. No CRUD, no own auth."
requires-python = ">=3.12,<3.13"
# Licenses (all permissive, ADR 008 / closed repo):
#   fastapi MIT · starlette BSD-3 · pydantic MIT · pydantic-settings MIT · httpx BSD-3
#   PyJWT MIT · cryptography Apache-2.0 OR BSD-3 · uvicorn BSD-3
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.9,<3",
    "cryptography>=43",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
# pytest MIT · pytest-cov MIT · anyio MIT · respx BSD-3 · ruff MIT · mypy MIT
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "ASYNC", "BLE"]
# PLR0913: FastAPI handlers/dataclasses legitimately take many args.
# PLR2004: literal status codes in tests/handlers are clearer than constants.
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415", "PLR0915"]
"scripts/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
