# Bake-off candidate (PRIMARY #1, ADR 001): YOLOX-Nano. Code Apache-2.0 (verified). Pretrained
# yolox_nano.pth: NO explicit weights licence (only the repo's Apache-2.0; maintainer question
# YOLOX#1865 unanswered). ADR 014 §5: the product owner ACCEPTS the risk (implied Apache-2.0, competition use) ->
# license_verified: true WITH license_note: owner_accepted_risk. This is NOT a verification: run.json, labels.json
# (licenses.weights.basis) and the MODEL_CARD banner say owner_accepted_risk; --release stays blocked until re-review.
# NOT RUN in this repo. Install YOLOX from the pinned commit trainers/yolox_adapter.YOLOX_COMMIT
# (after the GPL code removal, YOLOX#765/#781). Notebook: kaggle/yolox_nano_kaggle.py.
# Export route: torch -> ONNX (decode_in_inference=False, head Sigmoid stripped, decoder runs in the app) ->
# onnx2tf 2.6.9 -oiqt, tf_converter backend first (flatbuffer_direct INT8 broke parity on a tiny test graph), pick by parity.
schema_version: 1
candidate: yolox_nano
trainer: yolox
priority: high
license_verified: true
license_note: owner_accepted_risk   # ADR 014 §5 -- must match ml/data/license_gate.yaml
data:
  canonical: ../data/processed/ahmed2025/canonical.jsonl
  splits: ../data/processed/ahmed2025/splits/splits.json
  images_root: ../data/raw/ahmed2025
  datasets: [ahmed2025]
  classes: [caries_permanent, caries_primary]
model:
  variant: yolox_nano          # depth 0.33, width 0.25, depthwise conv
  input_size: [416, 416]
  pretrained: yolox_nano.pth   # COCO-pretrained, from GitHub releases
  output_format: yolox_raw     # [1, sum(HW/stride^2), 5 + num_classes]
  output_format_verified: false
  preprocess:            # YOLOX ValTransform(legacy=False): cv2 BGR, no mean/std, top-left letterbox pad 114
    color_order: BGR
    input_dtype: float32  # onnx2tf INT8 models may keep float32 I/O; replaced by interpreter values when available
    pixel_range: [0, 255]
    mean: [0, 0, 0]
    std: [1, 1, 1]
    resize_method: letterbox
    align: top_left
    pad_value: 114
    interpolation: bilinear
  decode:
    strides: [8, 16, 32]
    sigmoid_applied: false  # export_onnx strips the head obj/cls Sigmoid (onnx2tf flatbuffer_direct INT8 rejects LOGISTIC
                            # outputs; proven 2026-10-10 on a tiny graph) -> the app applies the sigmoid
  output_tensors:
    - {index: 0, role: raw, shape: [1, 3549, 7], dtype: float32}
train:
  seed: 20261008
  epochs: 150
  batch_size: 32
  learning_rate: 0.01           # YOLOX basic_lr_per_img * 64 default scaling; tune
augment:
  flashlight_hotspot: true
  white_balance_shift: true
  motion_blur: true
  lip_occlusion: true
  horizontal_flip: true
  supported_by_trainer: true
export:
  format: tflite
  int8: true
  max_size_mb: 15
  path: "tools/export_onnx.py (no --decode_in_inference) -> onnx2tf -oiqt (INT8) ; check_int8_parity.py"
  representative_samples: 200
trainer_options:
  layout: yolox
  yolox_repo: ../../third_party/YOLOX   # local clone, NOT committed (notebook overrides the path)
  devices: 1
  fp16: true
  act: silu               # silu = matches COCO-pretrained weights; relu = INT8-friendlier fallback if parity fails
  max_side: 832           # EXIF-free training copies, longest side (2x input)
  workers: 4
  eval_interval: 10
  resume: auto            # latest_ckpt.pth in output_dir / resume_from (Kaggle session resets)
notes:
  - "Mosaic/MixUp defaults of YOLOX may hide small lesions; record settings in the run."
