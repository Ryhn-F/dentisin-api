[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dentisai-brushing"
version = "0.1.0"
description = "DentisAI brushing prototype: rule-based scorer on landmark feature streams (no video, no frames)."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
  # zoneinfo needs the IANA database on Windows.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only used by prototype_mediapipe.py (head pose from a 4x4 matrix). The scorer itself is pure Python.
fast = ["numpy>=1.26"]
# NOT a hard dependency (ADR 008: keep the shipped surface small; license + maintenance must be checked first).
prototype = ["mediapipe", "opencv-python", "numpy>=1.26"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[tool.setuptools]
py-modules = ["brushing_score", "rules_loader", "release_check", "checkin", "synthetic", "validate_labels", "generate_cases"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=. --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
# The MediaPipe script needs a camera/model files and is not testable in CI; see README.
omit = ["tests/*", "prototype_mediapipe.py", ".venv/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "brushing_score.py",
  "rules_loader.py",
  "release_check.py",
  "checkin.py",
  "synthetic.py",
  "validate_labels.py",
  "generate_cases.py",
  "prototype_mediapipe.py",
  "tests",
]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "numpy.*"]
ignore_missing_imports = true
