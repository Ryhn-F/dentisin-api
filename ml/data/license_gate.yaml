# ml/detection/tests/test_license_gate.py checks that every id below appears in LICENSES.md).
# Read by ml/detection/train.py and export.py. ADR 001 / ADR 008 / backend/CLAUDE.md §3.4.
#
# status (datasets):  allowed | blocked_unverified | internal_only | forbidden
# status (models):    candidate | forbidden_in_product
# "verified: true" ONLY when a person (or agent) actually read the LICENSE / record page; cite it.
schema_version: 1
updated_at: "2026-10-08"

datasets:
  ahmed2025:
    name: "Annotated intraoral image dataset for dental caries detection"
    url: "https://zenodo.org/records/14827784"
    doi: "10.5281/zenodo.14827784"
    version: "v1"
    license: "CC-BY-4.0"
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    license_verified: true
    verified_source: "Zenodo record page https://zenodo.org/records/14827784 (read 2026-10-08)"
    status: allowed
    may_upload_to_third_party_compute: true   # public data -> Kaggle/Colab allowed
    attribution_en: >-
      Contains data from "Annotated intraoral image dataset for dental caries detection" by
      S. M. F. Ahmed, H. Ghori, A. Khalid, A. Nooruddin, N. Adnan, A. Lal and F. Umer
      (Aga Khan University), Zenodo, doi:10.5281/zenodo.14827784, licensed under CC BY 4.0
      (https://creativecommons.org/licenses/by/4.0/). Changes: annotations re-mapped to DentisAI
      classes, images resized; the dataset was used to train a model.
    attribution_id: >-
      Model ini dilatih memakai data dari "Annotated intraoral image dataset for dental caries
      detection" oleh S. M. F. Ahmed, H. Ghori, A. Khalid, A. Nooruddin, N. Adnan, A. Lal dan
      F. Umer (Aga Khan University), Zenodo, doi:10.5281/zenodo.14827784, lisensi CC BY 4.0
      (https://creativecommons.org/licenses/by/4.0/). Perubahan: label dipetakan ulang ke kelas
      DentisAI dan ukuran gambar diubah.
  dentalai:
    name: "DENTALAI"
    url: "https://datasetninja.com/dentalai"
    license: "CC-BY-4.0 (per Dataset Ninja listing only)"
    license_verified: false   # [PERLU VERIFIKASI] original publisher/license not checked
    status: blocked_unverified
    may_upload_to_third_party_compute: true
  alphadent:
    name: "AlphaDent"
    url: "https://arxiv.org/abs/2507.22512"
    license: "CC-BY-SA-4.0"
    license_verified: false   # [PERLU VERIFIKASI] per-file license; arXiv page only
    status: internal_only     # share-alike: never used for a shipped model (ADR 008)
    may_upload_to_third_party_compute: true
  kaggle_oral_diseases:
    name: "Kaggle 'oral diseases' (web-scraped images)"
    license: null
    license_verified: false
    status: forbidden         # images from dental websites without permission
    may_upload_to_third_party_compute: false
  local_children_id:
    name: "DentisAI local pediatric photos (future, KEPK + consent (c) required)"
    license: "n/a (personal health data of children, UU PDP 27/2022)"
    license_verified: false
    status: blocked_unverified   # until KEPK approval + consent (c)
    may_upload_to_third_party_compute: false   # NEVER Kaggle/Colab; team PC / campus lab only

