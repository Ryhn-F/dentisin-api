# Scheduled Supabase maintenance jobs (right-to-delete + photo retention + free-tier quota alert).
# The Edge Functions are service-only: they compare the bearer token with their CRON_SECRET
# function secret and fail closed. It lives ONLY in GitHub Actions secrets + Supabase secrets.
#
# Required secrets in the GitHub Environment `development` (Settings -> Environments -> development):
#   SUPABASE_URL                 e.g. https://<ref>.supabase.co
#   CRON_SECRET                  same value as the CRON_SECRET function secret (NOT the service_role key)
#
# GitHub cron is UTC and may be delayed or skipped under load; scheduled workflows are also
# disabled after 60 days without repo activity -> re-enable them if that happens.
# Responses contain counts only (no ids/paths/e-mails), so printing the body is safe.
name: scheduled-jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # process-deletion: every 6 hours
    - cron: "43 20 * * *"    # retention-sweep: daily 20:43 UTC (03:43 WIB)
    - cron: "7 1 * * *"      # quota-check: daily 01:07 UTC (08:07 WIB)
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [both, process-deletion, retention-sweep, quota-check]
        default: both

permissions: {}

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || github.event.inputs.job || 'manual' }}
  cancel-in-progress: false

jobs:
  process-deletion:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *' }}
    runs-on: ubuntu-latest
    environment: development # secrets live in the `development` environment, not repo-level
    timeout-minutes: 5
    steps:
      - name: Skip when not selected
        id: sel
        env:
          JOB: ${{ github.event.inputs.job }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && { [ "${JOB}" = "retention-sweep" ] || [ "${JOB}" = "quota-check" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Invoke process-deletion
        if: steps.sel.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?missing secret SUPABASE_URL}"
          : "${CRON_SECRET:?missing secret CRON_SECRET}"
          # Key goes through a config file on stdin so it never appears in the process list.
          # 207 = some requests failed -> --fail-with-body does not trip on it, so check explicitly.
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" \
            | curl -sS --max-time 120 --retry 2 --retry-delay 5 -X POST \
                -K - -o body.json -w '%{http_code}' \
                "${SUPABASE_URL%/}/functions/v1/process-deletion")
          echo "HTTP ${code}"; cat body.json; echo
          [ "${code}" = "200" ]

  retention-sweep:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '43 20 * * *' }}
    runs-on: ubuntu-latest
    environment: development # secrets live in the `development` environment, not repo-level
    timeout-minutes: 5
    steps:
      - name: Skip when not selected
        id: sel
        env:
          JOB: ${{ github.event.inputs.job }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && { [ "${JOB}" = "process-deletion" ] || [ "${JOB}" = "quota-check" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Invoke retention-sweep
        if: steps.sel.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?missing secret SUPABASE_URL}"
          : "${CRON_SECRET:?missing secret CRON_SECRET}"
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" \
            | curl -sS --max-time 120 --retry 2 --retry-delay 5 -X POST \
                -K - -o body.json -w '%{http_code}' \
                "${SUPABASE_URL%/}/functions/v1/retention-sweep")
          echo "HTTP ${code}"; cat body.json; echo
          [ "${code}" = "200" ]

  # Free-tier quota alert (IMPLEMENTATION_PLAN 5.4). The function always answers 200 with
  # numbers only; THIS step turns the status into the alert: warn -> yellow annotation,
  # critical -> failed run (GitHub e-mails the owner about failed scheduled runs: Rp0).
  # Egress and Edge Function invocations are not measurable from SQL -> dashboard Usage page.
  quota-check:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '7 1 * * *' }}
    runs-on: ubuntu-latest
    environment: development # secrets live in the `development` environment, not repo-level
    timeout-minutes: 5
    steps:
      - name: Skip when not selected
        id: sel
        env:
          JOB: ${{ github.event.inputs.job }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${JOB}" != "quota-check" ] && [ "${JOB}" != "both" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Invoke quota-check
        if: steps.sel.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?missing secret SUPABASE_URL}"
          : "${CRON_SECRET:?missing secret CRON_SECRET}"
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" \
            | curl -sS --max-time 60 --retry 2 --retry-delay 5 -X POST \
                -K - -o body.json -w '%{http_code}' \
                "${SUPABASE_URL%/}/functions/v1/quota-check")
          echo "HTTP ${code}"; cat body.json; echo
          [ "${code}" = "200" ]
          jq -r '.metrics[] | "\(.metric): \(.used) / \(.limit) \(.unit) (\(.pct)%) \(.status)"' body.json
          jq -r '.metrics[] | select(.status != "ok")
                 | "::warning title=quota \(.status)::\(.metric) \(.used)/\(.limit) \(.unit) (\(.pct)%)"' body.json
          overall=$(jq -r '.overall_status' body.json)
          echo "overall_status=${overall}"
          if [ "${overall}" = "critical" ]; then
            echo "::error title=quota critical::Supabase Free quota >= critical_pct; see supabase/README.md (Kuota)"
            exit 1
          fi
